{% extends "base.html" %}

{% block title %}
AI Answer
{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h2>💬 Question</h2>

        <p>{{ question }}</p>

    </div>

    <div class="card">

        <h2>🤖 AI Answer</h2>

        <p>{{ answer }}</p>

    </div>

    <div class="card">

        <h2>📚 Sources</h2>

        <ul>

            {% for source in sources %}
                <li>{{ source.document }}</li>
            {% endfor %}

        </ul>

    </div>

    <a href="/" class="secondary-btn">
        Upload Another Document
    </a>

</div>

{% endblock %}
